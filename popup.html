<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRIDE Inventory Helper</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1>STRIDE Inventory Helper</h1>
  <label><span data-text="language">Language</span>
    <select id="language" disabled>
      <option value="en" lang="en">English</option>
      <option value="pt-PT" lang="pt-PT">Português (Portugal)</option>
    </select>
  </label>
  <a data-text="cases" href="https://stridecsgo.net/cases" target="_blank" rel="noopener noreferrer">Open cases on STRIDE ↗</a>
  <form id="record">
    <label class="wide"><span data-text="box">Case</span><input name="box" required maxlength="140"></label>
    <label><span data-text="count">Openings</span><input name="count" type="number" min="1" max="1000000" value="1" required></label>
    <label><span data-text="cost">Total cost</span><input name="cost" type="number" min="0" max="1000000000000" required></label>
    <label class="wide"><span data-text="value">Total drop value</span><input name="value" type="number" min="0" max="1000000000000" required></label>
    <button class="wide" type="submit" data-text="submit" disabled>Record opening</button>
  </form>
  <section aria-labelledby="history-title">
    <h2 id="history-title" data-text="history">History</h2>
    <label><span data-text="filter">Filter by case</span><input id="filter" type="search"></label>
    <p id="totals"></p>
    <button id="export" type="button" data-text="export" disabled>Export CSV</button>
    <ul id="history"></ul>
  </section>
  <p id="status" role="status"></p>
</main>
<script src="translations.js" defer></script>
<script src="popup.js" defer></script>
</html>
