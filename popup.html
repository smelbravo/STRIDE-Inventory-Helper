<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRIDE Inventory Helper</title>
<link rel="stylesheet" href="popup.css">
<main>
  <header class="brand">
    <img src="icons/logo.svg" width="32" height="32" alt="">
    <h1>STRIDE <span>Inventory Helper</span></h1>
  </header>
  <nav class="tabs">
    <button type="button" data-panel="cases-panel" data-text="casesTab" aria-controls="cases-panel" aria-pressed="true">Cases</button>
    <button type="button" data-panel="history-panel" data-text="history" aria-controls="history-panel" aria-pressed="false">History</button>
    <button type="button" data-panel="settings-panel" data-text="settingsTab" aria-controls="settings-panel" aria-pressed="false">Settings</button>
  </nav>
  <section id="cases-panel">
    <div class="card">
    <header class="section-heading">
    <h2 id="auto-title" data-text="autoTitle">Auto Case Open</h2>
    <button id="load-catalog" type="button" data-text="loadCatalog">Load case catalog</button>
    </header>
    <div id="catalog-label" hidden>
      <label><span data-text="categoryLabel">Category</span><select id="case-category"></select></label>
      <label><span data-text="catalogSearch">Search catalog</span><input id="case-search" type="search"></label>
      <label><span data-text="catalogItem">Item</span><select id="case-picker"></select></label>
    </div>
    <p id="catalog-status" role="status"></p>
    <form id="auto-open">
      <label class="wide"><span><input name="skipAnimation" type="checkbox" checked> <span data-text="autoSkip">Skip opening animation</span></span></label>
      <label class="wide"><span data-text="autoCount">Additional cases</span><input name="quantity" type="number" min="1" max="1000000" required></label>
      <button type="submit" data-text="autoStart">Start</button>
      <button id="auto-stop" type="button" data-text="autoStop">Stop</button>
    </form>
    <p id="auto-status" role="status"></p>
    <details id="session-drops" hidden>
      <summary data-text="sessionDrops">Session drops</summary>
      <ul id="session-drop-list"></ul>
    </details>
    <button id="show-case-tab" type="button" data-text="showCaseTab" hidden>Go to case tab</button>
    </div>
  </section>
  <section id="history-panel" hidden>
  <div class="card">
    <h2 id="history-title" data-text="history">History</h2>
    <label><span data-text="filter">Filter by case</span><input id="filter" type="search"></label>
    <p id="totals"></p>
    <ul id="history"></ul>
    <button id="export" type="button" data-text="export" disabled>Export CSV</button>
  </div>
  <details class="card">
  <summary data-text="manualTitle">Record a batch</summary>
  <form id="record">
    <button id="import-result" class="wide" type="button" data-text="importResult" disabled>Fill from STRIDE results</button>
    <label class="wide"><span data-text="box">Case</span><input name="box" required maxlength="140"></label>
    <label><span data-text="count">Openings</span><input name="count" type="number" min="1" max="1000000" value="1" required></label>
    <label><span data-text="cost">Total cost</span><input name="cost" type="number" min="0" max="1000000000000" required></label>
    <label class="wide"><span data-text="value">Total drop value</span><input name="value" type="number" min="0" max="1000000000000" required></label>
    <button class="wide" type="submit" data-text="submit" disabled>Record opening</button>
  </form>
    <p id="status" role="status"></p>
  </details>
  </section>
  <section id="settings-panel" hidden>
    <div class="card">
      <label><span data-text="language">Language</span>
        <select id="language" disabled>
          <option value="en" lang="en">English</option>
          <option value="pt-PT" lang="pt-PT">Português (Portugal)</option>
        </select>
      </label>
      <p id="language-status" role="status"></p>
    </div>
  </section>
</main>
<script src="translations.js" defer></script>
<script src="popup.js" defer></script>
</html>
